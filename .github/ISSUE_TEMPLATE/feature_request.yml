name: Feature proposal
description: Propose a scoped product, physics, or engineering improvement
title: "[Feature]: "
labels: ["type: feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How would we know this is physically and technically correct?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility, data, and license impact
      description: Note schemas, dependencies, datasets, performance, privacy, or safety implications.
