name: Release

# docs/RELEASES.md steps 5 to 9 were manual: build in clean environments,
# attach artifacts and SHA-256 checksums, publish. This workflow is written to
# automate them, but it has never run, so RELEASES.md keeps the caveat that a
# tag must not imply installers exist until a run has exercised it end to end.
#
# `workflow_dispatch` builds and attests exactly the same way but uploads to the
# run instead of to a release, so the whole path can be exercised without
# spending a tag on it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  artifacts:
    name: Build, attest, and publish artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # attach artifacts to the drafted release
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --all-extras --dev

      - name: Verify the tag matches the version being released
        # A tag that disagrees with the packaged version produces artifacts that
        # cannot be traced back to it, which is the one thing a release is for.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'import importlib.metadata as m; print(m.version("openkartline"))')"
          if [ "$tag" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match packaged version $packaged" >&2
            exit 1
          fi

      - name: Build the Python distributions
        # The build backend writes the files that get checksummed and attested,
        # yet uv.lock does not cover it: `uv build` installs it into its own
        # isolated environment, from pyproject.toml's setuptools>=84.0.0, which
        # would take whatever release is newest. So the backend is held to one
        # file by hash. setuptools declares no dependencies of its own, so that
        # file is the whole build environment. Raising pyproject.toml's floor
        # past this pin fails the build until the pin is raised with it.
        run: |
          printf '%s\n' \
            'setuptools==84.0.0 --hash=sha256:51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670' \
            > "$RUNNER_TEMP/build-constraints.txt"
          uv build --build-constraints "$RUNNER_TEMP/build-constraints.txt" \
            --require-hashes --out-dir dist

      - name: Build and pack the web application
        run: |
          pnpm --filter @openkartline/web build
          # On a dispatch, GITHUB_REF_NAME is the branch, and a branch such as
          # codex/lap-plan-recovery would make tar look for a directory that
          # does not exist. upload-artifact also rejects " < > |, which git
          # allows in a branch name. A tag such as v0.2.0 passes unchanged.
          ref="${GITHUB_REF_NAME//[^A-Za-z0-9._+-]/-}"
          tar --create --gzip \
            --file "dist/openkartline-web-${ref}.tar.gz" \
            --directory apps/web/dist .

      - name: Generate software bills of materials
        # Each describes what ships, not the toolchain that built it: the
        # production dependencies bundled into the web build, and the locked
        # runtime requirements of the Python distributions. The dev tools are
        # the `dev` extra, which `uv export` leaves out unless asked; --no-dev
        # keeps out a `dev` dependency group too, which it would otherwise add.
        #
        # This step runs after dist/ is written and before the checksums and
        # the attestation vouch for it, in a job that can write to releases, so
        # it runs only tools that are already pinned: pnpm by `packageManager`,
        # uv above. cyclonedx-bom, fetched here before, brought code that no pin
        # or lock covers: even at an exact version, it declares its own
        # dependencies by range. The price is that uv writes CycloneDX 1.5, not
        # 1.6, in a format uv calls experimental; with uv pinned, that format
        # changes only when the pin does.
        #
        # `pnpm sbom` rather than cdxgen also because cdxgen's --required-only
        # listed @playwright/test and @testing-library/react and missed
        # scheduler.
        run: |
          pnpm --filter @openkartline/web sbom --sbom-format cyclonedx \
            --sbom-spec-version 1.6 --sbom-type application --prod \
            --out dist/sbom-web.cdx.json
          uv export --quiet --locked --no-dev --format cyclonedx1.5 \
            --preview-features sbom-export -o dist/sbom-python.cdx.json

      - name: Checksum every artifact
        working-directory: dist
        run: |
          # Named explicitly rather than by glob: `./*` would be expanded
          # before the redirect creates SHA256SUMS, which is correct but relies
          # on an ordering subtlety a reader should not have to know.
          sha256sum ./*.tar.gz ./*.whl ./*.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Upload artifacts to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

      - name: Attach the artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
