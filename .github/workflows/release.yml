name: Release

# docs/RELEASES.md steps 5 to 9 were manual: build in clean environments,
# attach artifacts and SHA-256 checksums, publish. This is the automation for
# them, but it is not yet verified: its shell steps were run locally, not on
# GitHub, so RELEASES.md keeps the caveat that a tag must not imply installers
# exist until a dispatch run has exercised the whole workflow end to end.
#
# `workflow_dispatch` builds and attests exactly the same way but uploads to the
# run instead of to a release, so the whole path can be exercised without
# spending a tag on it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  artifacts:
    name: Build, attest, and publish artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # attach artifacts to the drafted release
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --all-extras --dev

      - name: Verify the tag matches the version being released
        # A tag that disagrees with the packaged version produces artifacts that
        # cannot be traced back to it, which is the one thing a release is for.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'import importlib.metadata as m; print(m.version("openkartline"))')"
          if [ "$tag" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match packaged version $packaged" >&2
            exit 1
          fi

      - name: Build the Python distributions
        run: uv build --out-dir dist

      - name: Build and pack the web application
        run: |
          pnpm --filter @openkartline/web build
          # On a dispatch, GITHUB_REF_NAME is the branch, and a branch such as
          # codex/lap-plan-recovery would make tar look for a directory that
          # does not exist. upload-artifact also rejects " < > |, which git
          # allows in a branch name. A tag such as v0.2.0 passes unchanged.
          ref="${GITHUB_REF_NAME//[^A-Za-z0-9._+-]/-}"
          tar --create --gzip \
            --file "dist/openkartline-web-${ref}.tar.gz" \
            --directory apps/web/dist .

      - name: Generate software bills of materials
        # Each describes what ships, not the toolchain that built it: the
        # production dependencies bundled into the web build, and the locked
        # runtime requirements of the Python distributions. The dev tools are
        # the `dev` extra, which `uv export` leaves out unless asked; --no-dev
        # keeps out a `dev` dependency group too, which it would otherwise add.
        #
        # `pnpm sbom` rather than cdxgen: cdxgen's --required-only listed
        # @playwright/test and @testing-library/react and missed scheduler.
        # cyclonedx-py reads an exported requirements file because, given no
        # interpreter, `cyclonedx-py environment` inventories the uvx
        # environment it runs in -- cyclonedx-bom's own dependencies.
        #
        # cyclonedx-bom is pinned exactly because it runs between the build and
        # the checksums; the dependencies it declares by range still resolve
        # when it runs. pnpm is pinned by `packageManager`, uv above.
        run: |
          pnpm --filter @openkartline/web sbom --sbom-format cyclonedx \
            --sbom-spec-version 1.6 --sbom-type application --prod \
            --out dist/sbom-web.cdx.json
          uv export --quiet --locked --no-dev --no-emit-project \
            --format requirements.txt -o "$RUNNER_TEMP/requirements-runtime.txt"
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py requirements \
            --pyproject pyproject.toml --mc-type library --sv 1.6 --of JSON \
            -o dist/sbom-python.cdx.json "$RUNNER_TEMP/requirements-runtime.txt"

      - name: Checksum every artifact
        working-directory: dist
        run: |
          # Named explicitly rather than by glob: `./*` would be expanded
          # before the redirect creates SHA256SUMS, which is correct but relies
          # on an ordering subtlety a reader should not have to know.
          sha256sum ./*.tar.gz ./*.whl ./*.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Upload artifacts to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

      - name: Attach the artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
