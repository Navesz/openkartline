name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "CITATION.cff"
      - "packages/schemas/**/*.json"
      - "examples/**/*.json"
      - ".github/workflows/docs.yml"
      - ".github/.markdownlint-cli2.jsonc"
      - ".github/lychee.toml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown:
    name: Documentation, schema, and citation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: false
      - name: Validate citation metadata
        run: uvx --from cffconvert==2.0.0 cffconvert --validate
      - name: Validate project schema and example
        run: |
          uvx --from check-jsonschema==0.36.1 check-jsonschema --check-metaschema packages/schemas/okl-project-0.1.0.schema.json
          uvx --from check-jsonschema==0.36.1 check-jsonschema --check-metaschema packages/schemas/okl-project-0.2.0.schema.json
          uvx --from check-jsonschema==0.36.1 check-jsonschema --schemafile packages/schemas/okl-project-0.2.0.schema.json examples/tracks/circuito-aurora.okl.json
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .github/.markdownlint-cli2.jsonc
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .github/lychee.toml "**/*.md"
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
