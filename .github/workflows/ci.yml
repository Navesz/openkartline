name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff formatting
        run: uv run ruff format --check .
      - name: Static type checking
        run: uv run mypy engine services

  python-tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run Python tests
        run: uv run pytest

  web-quality:
    name: Web quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests and coverage gate
        run: pnpm test:coverage
      - name: Production build
        run: pnpm build

  web-e2e:
    # One job per engine, and the name is built so the Chromium job still
    # reports as `Browser E2E (Chromium)`. That string is an identifier: the
    # "Protect main" ruleset requires it by name, so renaming this job would
    # have left every pull request waiting forever on a check that no longer
    # exists. Firefox and WebKit report under their own names and can be added
    # to the required list whenever that is wanted.
    name: Browser E2E (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: web-quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            label: Chromium
          - project: firefox
            label: Firefox
          - project: webkit
            label: WebKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev
      - name: Install ${{ matrix.label }}
        run: pnpm --filter @openkartline/web exec playwright install --with-deps ${{ matrix.project }}
      - name: Run browser fallback and API integration tests
        shell: bash
        run: |
          uv run openkartline-api > "$RUNNER_TEMP/openkartline-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              OPENKARTLINE_E2E_EXPECT_API=1 pnpm test:e2e --project=${{ matrix.project }}
              exit $?
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/openkartline-api.log"
          exit 1
