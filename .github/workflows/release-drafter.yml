name: Release drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-drafter
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-draft:
    name: Update draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Update one draft release.
      pull-requests: read # Build notes from merged PR metadata.
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
