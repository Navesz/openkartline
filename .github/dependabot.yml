version: 2
updates:
  # The uv ecosystem regenerates uv.lock alongside pyproject.toml; the pip
  # ecosystem does not, which left every Python bump failing `uv sync --locked`.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # TypeScript majors are held back until typescript-eslint declares support;
    # otherwise the grouped dev PR fails lint on "does not support TS <version>".
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      javascript-runtime:
        dependency-type: production
      javascript-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
