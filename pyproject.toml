[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openkartline"
version = "0.1.0"
description = "Open-source kart racing line and lap simulation engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenKartLine contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.4.6,<2.5",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.52.1,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=2.3.0,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
openkartline-api = "openkartline_api.main:run"

[tool.setuptools.packages.find]
where = ["engine", "services/api"]
include = ["openkartline_engine*", "openkartline_api*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=openkartline_engine --cov=openkartline_api --cov-report=term-missing"
testpaths = ["tests/python"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Just under the 93.69% the suite actually reaches, so the gate defends the
# coverage that exists rather than one it passed years of commits ago.
fail_under = 92
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["engine", "services/api", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["engine", "services/api"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true
